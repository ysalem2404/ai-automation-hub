<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <defs>
    <linearGradient id="tG" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#21B0B5"/>
      <stop offset="100%" stop-color="#148A8E"/>
    </linearGradient>
    <linearGradient id="nG" x1="0.5" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E4A6E"/>
      <stop offset="100%" stop-color="#112D48"/>
    </linearGradient>
    <clipPath id="topHalf">
      <rect x="0" y="0" width="200" height="52"/>
    </clipPath>
    <clipPath id="botHalf">
      <rect x="0" y="48" width="200" height="60"/>
    </clipPath>
  </defs>

  <g transform="translate(4, 10)">
    <!-- Left hexagonal ring (teal) -->
    <path d="M8 50 L28 6 L72 6 L92 50 L72 94 L28 94 Z" fill="url(#tG)"/>
    <path d="M22 50 L36 18 L64 18 L78 50 L64 82 L36 82 Z" fill="white"/>

    <!-- Right hexagonal ring (navy) — shifted right by ~50 -->
    <path d="M58 50 L78 6 L122 6 L142 50 L122 94 L78 94 Z" fill="url(#nG)"/>
    <path d="M72 50 L86 18 L114 18 L128 50 L114 82 L86 82 Z" fill="white"/>

    <!-- Weave: navy over teal at top -->
    <g clip-path="url(#topHalf)">
      <path d="M58 50 L78 6 L122 6 L142 50 L122 94 L78 94 Z" fill="url(#nG)"/>
      <path d="M72 50 L86 18 L114 18 L128 50 L114 82 L86 82 Z" fill="white"/>
    </g>

    <!-- Weave: teal over navy at bottom -->
    <g clip-path="url(#botHalf)">
      <path d="M8 50 L28 6 L72 6 L92 50 L72 94 L28 94 Z" fill="url(#tG)"/>
      <path d="M22 50 L36 18 L64 18 L78 50 L64 82 L36 82 Z" fill="white"/>
    </g>
  </g>

  <!-- THALASSA text -->
  <text x="172" y="50" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-size="36" font-weight="700" letter-spacing="4" fill="#1A3A5C">THALASSA</text>
  <text x="174" y="82" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-size="20" font-weight="500" letter-spacing="8" fill="#148A8E">US</text>
</svg>