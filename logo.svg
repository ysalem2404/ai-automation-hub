<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <!-- Shield outline - angular flat top, rounded sides, pointed bottom -->
  <path d="M120 8 L198 38 Q204 41 204 47 L204 100 Q204 152 120 186 Q36 152 36 100 L36 47 Q36 41 42 38 Z" 
        fill="none" stroke="#1E3A5F" stroke-width="7" stroke-linejoin="round"/>
  
  <!-- Upper eyelid (navy) -->
  <path d="M62 88 Q82 56 120 52 Q158 56 178 88" 
        fill="none" stroke="#1E3A5F" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Lower eyelid (teal) -->
  <path d="M62 88 Q82 118 120 122 Q158 118 178 88" 
        fill="none" stroke="#0D9488" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Open hexagon iris (amber outline) - 5 of 6 sides, gap on upper-right -->
  <!-- Hex vertices at radius 22 around center (120,86): 
       top: 120,64  top-right: 139,75  bottom-right: 139,97  
       bottom: 120,108  bottom-left: 101,97  top-left: 101,75 -->
  <path d="M101 75 L120 64 M120 64 L120 64 M101 75 L101 97 L120 108 L139 97 L139 75" 
        fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Pupil (amber filled circle) -->
  <circle cx="120" cy="86" r="8" fill="#F59E0B"/>
  
  <!-- Circuit trace line from right eye corner, angling slightly up -->
  <line x1="178" y1="88" x2="208" y2="76" stroke="#1E3A5F" stroke-width="2.5"/>
  <!-- Circuit trace node endpoint (open circle) -->
  <circle cx="212" cy="74" r="4" fill="none" stroke="#1E3A5F" stroke-width="2.5"/>
</svg>
