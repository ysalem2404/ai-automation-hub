name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build React app
        run: npm run build
        
      - name: Create deployment structure
        run: |
          mkdir -p _site/tools/data-matcher
          mkdir -p _site/tools/med-equipment-map
          mkdir -p _site/tools/ai-datacenter-map
          
          echo "Copying Thalassa US site pages..."
          cp favicon.ico favicon-32.png apple-touch-icon.png og-image.png logo-128.png _site/ 2>/dev/null || true
          cp index.html _site/index.html
          cp demos.html _site/demos.html
          cp engage.html _site/engage.html
          cp about.html _site/about.html
          cp contact.html _site/contact.html
          cp base.css _site/base.css
          cp style.css _site/style.css
          cp app.js _site/app.js
          
          echo "Copying React app (Data Matcher)..."
          if [ -f dist/data-matcher.html ]; then
            mv dist/data-matcher.html dist/index.html
          fi
          cp -r dist/. _site/tools/data-matcher/
          
          echo "Copying Medical Equipment Map..."
          cp -r tools/med-equipment-map/. _site/tools/med-equipment-map/
          
          echo "Copying AI Datacenter Map..."
          cp -r tools/ai-datacenter-map/. _site/tools/ai-datacenter-map/
          
          echo "Copying CNAME for custom domain..."
          cp CNAME _site/CNAME
          
          echo "===== Final structure ====="
          find _site/ -type f
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
